<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>军理900题题库 - 答题系统</title>
<style>
/* ====== RESET & BASE ====== */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', 'PingFang SC', sans-serif;
  min-height: 100vh;
  background: #2c3e1a;
  position: relative;
  overflow-x: hidden;
}

/* ====== CAMO BACKGROUND ====== */
body::before {
  content: '';
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  z-index: 0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 30%, #4a6b2a 0%, transparent 50%),
    radial-gradient(ellipse 60% 50% at 70% 60%, #3d5522 0%, transparent 40%),
    radial-gradient(ellipse 90% 40% at 50% 20%, #556b2f 0%, transparent 55%),
    radial-gradient(ellipse 50% 70% at 30% 80%, #3a4f20 0%, transparent 45%),
    radial-gradient(circle at 15% 15%, #5a7a30 0%, transparent 30%),
    radial-gradient(circle at 85% 25%, #4a6a28 0%, transparent 25%),
    radial-gradient(circle at 60% 85%, #3d5622 0%, transparent 35%),
    radial-gradient(circle at 40% 50%, #506a2e 0%, transparent 28%),
    linear-gradient(160deg, #334820 0%, #3d5522 30%, #2c3e1a 60%, #4a6328 100%);
}

/* Camo splotches overlay */
body::after {
  content: '';
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  z-index: 0; opacity: 0.35; pointer-events: none;
  background:
    /* Blob shapes */
    radial-gradient(ellipse 120px 80px at 10% 20%, #232f12 0%, transparent 100%),
    radial-gradient(ellipse 100px 140px at 25% 40%, #1a250d 0%, transparent 100%),
    radial-gradient(ellipse 90px 110px at 45% 15%, #2a3816 0%, transparent 100%),
    radial-gradient(ellipse 130px 70px at 60% 35%, #1e2d10 0%, transparent 100%),
    radial-gradient(ellipse 110px 100px at 75% 55%, #243312 0%, transparent 100%),
    radial-gradient(ellipse 80px 130px at 90% 20%, #1a260c 0%, transparent 100%),
    radial-gradient(ellipse 140px 90px at 50% 70%, #212f10 0%, transparent 100%),
    radial-gradient(ellipse 100px 80px at 20% 75%, #293815 0%, transparent 100%),
    radial-gradient(ellipse 120px 100px at 80% 80%, #1c2a0e 0%, transparent 100%),
    radial-gradient(ellipse 90px 120px at 5% 55%, #263312 0%, transparent 100%),
    radial-gradient(ellipse 110px 70px at 55% 50%, #1f2d0e 0%, transparent 100%),
    radial-gradient(ellipse 150px 60px at 35% 90%, #223010 0%, transparent 100%),
    radial-gradient(ellipse 70px 110px at 95% 70%, #1a270c 0%, transparent 100%),
    radial-gradient(ellipse 100px 100px at 68% 92%, #253310 0%, transparent 100%);
}

.container { max-width: 820px; margin: 0 auto; padding: 20px; position: relative; z-index: 1; }

/* ====== MILITARY HEADER ====== */
.header {
  background: linear-gradient(180deg, #1a2c0d 0%, #243d14 50%, #1a2c0d 100%);
  color: #d4c898;
  padding: 28px 24px 24px;
  text-align: center;
  border: 3px solid #5a7a30;
  border-image: linear-gradient(180deg, #8b7355, #5a7a30, #8b7355) 1;
  position: relative;
  margin-bottom: 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
}
.header::before,
.header::after {
  content: '★';
  position: absolute; top: 50%; transform: translateY(-50%);
  font-size: 24px; color: #c9a84c;
}
.header::before { left: 20px; }
.header::after { right: 20px; }
.header h1 {
  font-size: 26px; letter-spacing: 4px; margin-bottom: 6px;
  color: #f0d878; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  font-weight: 900;
}
.header p {
  opacity: 0.8; font-size: 13px; letter-spacing: 2px;
  color: #b8a870; text-transform: uppercase;
}
.header .header-line {
  width: 60%; height: 1px; background: linear-gradient(90deg, transparent, #8b7355, transparent);
  margin: 10px auto 0;
}
.header .header-stars {
  display: flex; justify-content: center; gap: 16px; margin-top: 8px;
}
.header .header-stars span { color: #c9a84c; font-size: 10px; }

/* ====== STAT CARDS ====== */
.stats { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
.stat-card {
  background: linear-gradient(180deg, #2a3d16 0%, #1f2e0f 100%);
  padding: 12px 18px; text-align: center; min-width: 75px;
  border: 2px solid #4a6b2a; position: relative;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.stat-card::after {
  content: ''; position: absolute; top: 3px; left: 3px; right: 3px; bottom: 3px;
  border: 1px solid rgba(255,255,255,0.05); pointer-events: none;
}
.stat-card .num { font-size: 22px; font-weight: 900; color: #f0d878; font-family: 'Georgia', serif; }
.stat-card .label { font-size: 11px; color: #8a9b6e; margin-top: 2px; letter-spacing: 1px; }

/* ====== PROGRESS ====== */
.progress-wrap {
  background: linear-gradient(180deg, #1f2e0f 0%, #18250a 100%);
  padding: 14px 18px; margin-bottom: 20px;
  border: 2px solid #3d5522; position: relative;
}
.progress-bar { height: 6px; background: #0d1406; overflow: hidden; border: 1px solid #334818; }
.progress-fill {
  height: 100%; border-radius: 0;
  background: linear-gradient(90deg, #5a8a20, #7ab830, #c9a84c);
  transition: width 0.3s;
  box-shadow: 0 0 8px rgba(122,184,48,0.4);
}

/* ====== QUESTION CARD ====== */
.card {
  background: linear-gradient(180deg, #263812 0%, #1d2d0d 100%);
  padding: 24px; margin-bottom: 20px;
  border: 2px solid #4a6b2a;
  box-shadow: 0 4px 16px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.03);
  position: relative;
}
.card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, rgba(201,168,76,0.4), transparent);
}
.card .type-badge { display: inline-block; padding: 3px 12px; font-size: 12px; font-weight: 700; margin-bottom: 12px; letter-spacing: 1px; text-transform: uppercase; }
.type-single { background: #1a3a2a; color: #5adb8a; border: 1px solid #2d5a3a; }
.type-multi { background: #3a2a0d; color: #e8a840; border: 1px solid #6b4a1a; }
.type-judge { background: #1a2a3a; color: #5a9adb; border: 1px solid #2a4a6b; }
.card .q-num { font-size: 13px; color: #6a7b4e; margin-bottom: 8px; letter-spacing: 1px; }
.card .q-text { font-size: 17px; line-height: 1.8; color: #d4cca0; margin-bottom: 20px; font-weight: 500; }

/* ====== OPTIONS ====== */
.options { display: flex; flex-direction: column; gap: 10px; }
.option {
  display: flex; align-items: flex-start; padding: 14px 16px;
  border: 2px solid #3d4a22; cursor: pointer; transition: all 0.2s;
  background: #1f2e0f; position: relative;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
  touch-action: manipulation;
}
.option:hover { border-color: #8b7355; background: #253612; }
.option.selected { border-color: #c9a84c; background: #2d3d14; box-shadow: 0 0 12px rgba(201,168,76,0.2); }
.option.correct { border-color: #4a8a3a; background: #1a3a1a; }
.option.wrong { border-color: #8a3a3a; background: #3a1a1a; }
.option .opt-label {
  width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 14px; margin-right: 12px; flex-shrink: 0;
  background: #18240a; color: #8a9b6e; font-family: 'Georgia', serif;
  border: 2px solid #3d4a22;
}
.option.selected .opt-label { background: #c9a84c; color: #1a2c0d; border-color: #c9a84c; }
.option.correct .opt-label { background: #4a8a3a; color: #fff; border-color: #4a8a3a; }
.option.wrong .opt-label { background: #8a3a3a; color: #fff; border-color: #8a3a3a; }
.option .opt-text { flex: 1; font-size: 15px; line-height: 1.5; padding-top: 4px; color: #c8c0a0; }
.option.correct .opt-text { color: #8cd8a0; }
.option.wrong .opt-text { color: #d8a0a0; }

/* ====== BUTTONS ====== */
.btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
.btn {
  padding: 10px 22px; border: 2px solid #4a6b2a; font-size: 14px; cursor: pointer;
  transition: all 0.2s; font-weight: 700; letter-spacing: 1px;
  background: #1f2e0f; color: #b8a870; position: relative;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
  touch-action: manipulation;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
.btn:active { transform: translateY(0); }
.btn-primary { background: #3d5a1a; color: #f0d878; border-color: #6b8a2a; }
.btn-primary:hover { background: #4a6b22; border-color: #8b9b3a; }
.btn-success { background: #2a4a1a; color: #8cd880; border-color: #4a7a2a; }
.btn-success:hover { background: #345a22; }
.btn-outline { background: transparent; color: #8a9b6e; border-color: #4a5a2a; }
.btn-outline:hover { background: #1f2e0f; color: #c8c0a0; border-color: #6b7a3a; }
.btn-danger { background: #4a1a1a; color: #e8a0a0; border-color: #6b2a2a; }
.btn-danger:hover { background: #5a2222; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ====== MODE SELECT SCREEN ====== */
.mode-container { text-align: center; margin: 40px 0; }
.mode-title {
  font-size: 18px; color: #b8a870; margin-bottom: 8px; letter-spacing: 2px;
}
.mode-count {
  font-size: 15px; color: #6a7b4e; margin-bottom: 32px;
}
.mode-count b { color: #f0d878; font-size: 18px; }

.mode-section { margin-top: 32px; }
.mode-section-title {
  font-size: 14px; color: #8a9b6e; margin-bottom: 16px;
  letter-spacing: 2px; position: relative; display: inline-block;
}
.mode-section-title::before,
.mode-section-title::after {
  content: '—'; color: #4a6b2a; margin: 0 10px;
}

/* ====== RESULT SCREEN ====== */
.result-card { text-align: center; }
.result-card .rank-icon { font-size: 48px; margin-bottom: 8px; }
.result-card .score {
  font-size: 72px; font-weight: 900; color: #f0d878;
  font-family: 'Georgia', serif;
  text-shadow: 0 2px 8px rgba(0,0,0,0.5);
}
.result-card .score-detail { color: #8a9b6e; margin: 12px 0 24px; font-size: 15px; }
.result-card .score-detail b { color: #d4cca0; }
.result-card .bar-wrap {
  height: 10px; background: #0d1406; margin: 16px 0;
  border: 1px solid #334818; overflow: hidden;
}
.result-card .bar-fill { height: 100%; transition: width 0.5s; }
.result-card .bar-correct { background: linear-gradient(90deg, #4a8a3a, #6ab840, #c9a84c); }

.result-grade {
  margin-top: 20px; padding: 12px 24px; display: inline-block;
  font-size: 18px; font-weight: 800; letter-spacing: 3px;
  border: 2px solid;
}

/* ====== REVIEW ====== */
.review-item {
  background: #1d2d0d; padding: 16px; margin-bottom: 12px;
  border: 2px solid #3d4a22; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.review-item .status { display: inline-block; padding: 2px 10px; font-size: 12px; font-weight: 700; letter-spacing: 1px; }
.status-ok { background: #1a3a1a; color: #5adb8a; border: 1px solid #2d5a3a; }
.status-fail { background: #3a1a1a; color: #e88a8a; border: 1px solid #6b2a2a; }

/* ====== KEYBOARD HINT ====== */
.kbd-hint {
  text-align: center; font-size: 12px; color: #5a6b3a;
  margin-bottom: 14px; letter-spacing: 0.5px;
}
.kbd-hint b { color: #8a9b6e; }

/* ====== MILITARY ICON ACCENTS ====== */
.mil-icon { display: inline-block; vertical-align: middle; }
.badge-star { color: #c9a84c; }

/* ====== HIDDEN ====== */
.hidden { display: none !important; }

/* ====== RESPONSIVE ====== */
/* 平板端 */
@media (max-width: 820px) {
  .container { padding: 14px; }
  .header { padding: 20px 16px; }
  .header h1 { font-size: 22px; letter-spacing: 3px; }
  .header::before, .header::after { font-size: 18px; }
  .header::before { left: 12px; }
  .header::after { right: 12px; }
}

/* 手机端 */
@media (max-width: 600px) {
  .container { padding: 8px; }
  .header {
    padding: 18px 12px 14px;
    border-width: 2px;
  }
  .header h1 { font-size: 18px; letter-spacing: 2px; }
  .header p { font-size: 11px; letter-spacing: 1px; }
  .header::before, .header::after { font-size: 14px; }
  .header::before { left: 8px; }
  .header::after { right: 8px; }
  .header .header-stars { gap: 10px; margin-top: 6px; }
  .header .header-stars span { font-size: 8px; }
  .header .header-line { width: 80%; }

  /* 统计卡片：2行布局 */
  .stats { gap: 6px; flex-wrap: wrap; }
  .stat-card { padding: 10px 8px; min-width: 0; flex: 1 1 calc(33.33% - 6px); }
  .stat-card:last-child { flex: 1 1 100%; }
  .stat-card .num { font-size: 18px; }
  .stat-card .label { font-size: 10px; }

  .progress-wrap { padding: 10px 12px; }

  /* 题目卡片 */
  .card { padding: 14px 12px; }
  .card .q-text { font-size: 15px; line-height: 1.7; }
  .card .q-num { font-size: 11px; }
  .card .type-badge { font-size: 11px; padding: 2px 10px; }

  /* 选项 - 增大触控区域 */
  .option { padding: 12px 10px; gap: 0; }
  .option .opt-label {
    width: 36px; height: 36px; min-width: 36px; font-size: 13px; margin-right: 10px;
  }
  .option .opt-text { font-size: 14px; padding-top: 5px; }

  /* 按钮组 */
  .btn-group { gap: 8px; }
  .btn {
    padding: 12px 16px; font-size: 13px; letter-spacing: 0.5px;
    min-height: 44px; /* 触控最小44px */
  }
  .btn-primary[onclick*="startQuiz('all')"] {
    width: 100%; font-size: 15px; padding: 14px 24px;
  }

  /* 键盘提示仅桌面可见 */
  .kbd-hint { display: none; }

  /* 模式选择 */
  .mode-container { margin: 20px 0; }
  .mode-title { font-size: 15px; }
  .mode-count { font-size: 13px; }
  .mode-section-title { font-size: 12px; }

  /* 结果页 */
  .result-card .score { font-size: 52px; }
  .result-card .rank-icon { font-size: 36px; }
  .result-card .score-detail { font-size: 13px; }
  .result-grade { font-size: 15px; padding: 10px 18px; letter-spacing: 2px; }

  /* 错题回顾 */
  .review-item { padding: 12px; }
  .review-item p { font-size: 14px; }
}

/* 小屏手机 */
@media (max-width: 380px) {
  .header h1 { font-size: 16px; letter-spacing: 1px; }
  .header::before, .header::after { font-size: 12px; }
  .header::before { left: 4px; }
  .header::after { right: 4px; }
  .stat-card .num { font-size: 16px; }
  .stat-card .label { font-size: 9px; }
  .card .q-text { font-size: 14px; }
  .option { padding: 10px 8px; }
  .option .opt-label { width: 32px; height: 32px; min-width: 32px; font-size: 12px; margin-right: 8px; }
  .option .opt-text { font-size: 13px; }
  .btn { padding: 10px 12px; font-size: 12px; min-height: 40px; }
  .result-card .score { font-size: 42px; }
}
</style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <h1>★ 军 理 题 库 答 题 系 统 ★</h1>
    <p>MILITARY THEORY · EXAM PREPARATION</p>
    <div class="header-line"></div>
    <div class="header-stars">
      <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
    </div>
  </div>

  <!-- Mode Selection -->
  <div id="modeSelect">
    <div class="mode-container">
      <div class="mode-title">— 题 库 概 览 —</div>
      <p class="mode-count">共 <b id="totalCount">0</b> 道题目</p>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="startQuiz('all')" style="font-size:16px;padding:14px 48px;">
          ★ 全 部 题 目 练 习
        </button>
      </div>

      <div class="mode-section">
        <div class="mode-section-title">按 类 型 练 习</div>
        <div class="btn-group">
          <button class="btn btn-outline" onclick="startQuiz('single')">单选题 <b id="singleCount">0</b></button>
          <button class="btn btn-outline" onclick="startQuiz('multi')">多选题 <b id="multiCount">0</b></button>
          <button class="btn btn-outline" onclick="startQuiz('judge')">判断题 <b id="judgeCount">0</b></button>
        </div>
        <div class="btn-group" style="margin-top:8px;">
          <button class="btn btn-danger" onclick="startQuiz('wrong')">★ 错 题 重 练</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Quiz Area -->
  <div id="quizArea" class="hidden">
    <!-- Stats -->
    <div class="stats">
      <div class="stat-card"><div class="num" id="statCurrent">1</div><div class="label">当前题号</div></div>
      <div class="stat-card"><div class="num" id="statTotal">0</div><div class="label">总题数</div></div>
      <div class="stat-card"><div class="num" id="statCorrect" style="color:#5adb8a">0</div><div class="label">正确</div></div>
      <div class="stat-card"><div class="num" id="statWrong" style="color:#e88a8a">0</div><div class="label">错误</div></div>
      <div class="stat-card"><div class="num" id="statRemain">0</div><div class="label">剩余</div></div>
    </div>

    <!-- Progress -->
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>

    <!-- Keyboard hint (desktop only) -->
    <div class="kbd-hint">⌨ 键盘快捷键：<b>A-E</b> 选择 &nbsp;|&nbsp; <b>T/F</b> 判断题 &nbsp;|&nbsp; <b>Enter</b> 提交/下一题 &nbsp;|&nbsp; <b>←→</b> 翻题</div>

    <!-- Question Card -->
    <div class="card" id="questionCard">
      <div class="type-badge" id="typeBadge"></div>
      <div class="q-num" id="qNum"></div>
      <div class="q-text" id="qText"></div>
      <div class="options" id="optionsContainer"></div>
    </div>

    <!-- Buttons -->
    <div class="btn-group">
      <button class="btn btn-outline" id="btnPrev" onclick="prevQuestion()">◀ 上一题</button>
      <button class="btn btn-primary" id="btnSubmit" onclick="submitAnswer()">★ 提交答案</button>
      <button class="btn btn-success hidden" id="btnNext" onclick="nextQuestion()">下一题 ▶</button>
      <button class="btn btn-outline" id="btnBack" onclick="backToMenu()">返回菜单</button>
    </div>
  </div>

  <!-- Result Area -->
  <div id="resultArea" class="hidden">
    <div class="card result-card">
      <div class="rank-icon" id="rankIcon">🎖️</div>
      <p style="font-size:16px;color:#8a9b6e;margin-bottom:8px;letter-spacing:2px;">练 习 完 成</p>
      <div class="score" id="scorePercent">0%</div>
      <div class="score-detail">
        正确 <b id="resultCorrect" style="color:#5adb8a">0</b>
        &nbsp;/&nbsp;
        错误 <b id="resultWrong" style="color:#e88a8a">0</b>
        &nbsp;/&nbsp;
        总计 <b id="resultTotal">0</b>
      </div>
      <div class="bar-wrap"><div class="bar-fill bar-correct" id="resultBar" style="width:0%"></div></div>
      <div id="gradeComment" style="font-size:14px;color:#8a9b6e;margin-top:12px;"></div>

      <div class="btn-group" style="margin-top:20px;">
        <button class="btn btn-primary" onclick="reviewWrong()">★ 查看错题</button>
        <button class="btn btn-outline" onclick="restartQuiz()">重新练习</button>
        <button class="btn btn-outline" onclick="backToMenu()">返回菜单</button>
      </div>
    </div>
  </div>

  <!-- Review Area -->
  <div id="reviewArea" class="hidden">
    <div style="text-align:center;margin-bottom:20px;">
      <p style="font-size:18px;color:#d4cca0;letter-spacing:2px;">★ 错 题 回 顾 ★</p>
      <p style="font-size:14px;color:#8a9b6e;margin-top:4px;">共 <span id="reviewCount" style="color:#e88a8a;font-weight:700;">0</span> 题需要复习</p>
    </div>
    <div id="reviewList"></div>
    <div class="btn-group" style="margin-top:20px;">
      <button class="btn btn-primary" onclick="startQuiz('wrong')">★ 重做错题</button>
      <button class="btn btn-outline" onclick="restartQuiz()">全部重来</button>
      <button class="btn btn-outline" onclick="backToMenu()">返回菜单</button>
    </div>
  </div>
</div>

<script src="tiku_data.js"></script>
<script>
// ========== STATE ==========
let quizQuestions = [];
let currentIndex = 0;
let answers = {};
let submitted = {};
let wrongIds = JSON.parse(localStorage.getItem('military_wrong_ids') || '[]');

// ========== INIT ==========
document.getElementById('totalCount').textContent = QUESTION_BANK.length;
document.getElementById('singleCount').textContent = QUESTION_BANK.filter(q => q.type === 'single').length;
document.getElementById('multiCount').textContent = QUESTION_BANK.filter(q => q.type === 'multi').length;
document.getElementById('judgeCount').textContent = QUESTION_BANK.filter(q => q.type === 'judge').length;

function startQuiz(mode) {
  let pool;
  if (mode === 'all') {
    pool = [...QUESTION_BANK];
  } else if (mode === 'single' || mode === 'multi' || mode === 'judge') {
    pool = QUESTION_BANK.filter(q => q.type === mode);
  } else if (mode === 'wrong') {
    if (wrongIds.length === 0) {
      alert('没有错题记录！继续加油！');
      return;
    }
    pool = QUESTION_BANK.filter(q => wrongIds.includes(q.id));
  }

  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }

  quizQuestions = pool;
  currentIndex = 0;
  answers = {};
  submitted = {};

  document.getElementById('modeSelect').classList.add('hidden');
  document.getElementById('resultArea').classList.add('hidden');
  document.getElementById('reviewArea').classList.add('hidden');
  document.getElementById('quizArea').classList.remove('hidden');

  updateStats();
  renderQuestion();
}

function backToMenu() {
  document.getElementById('quizArea').classList.add('hidden');
  document.getElementById('resultArea').classList.add('hidden');
  document.getElementById('reviewArea').classList.add('hidden');
  document.getElementById('modeSelect').classList.remove('hidden');
}

function restartQuiz() {
  let pool = quizQuestions.length > 0 ? [...quizQuestions] : [...QUESTION_BANK];
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  quizQuestions = pool;
  currentIndex = 0;
  answers = {};
  submitted = {};
  document.getElementById('resultArea').classList.add('hidden');
  document.getElementById('reviewArea').classList.add('hidden');
  document.getElementById('quizArea').classList.remove('hidden');
  updateStats();
  renderQuestion();
}

// ========== RENDER ==========
function renderQuestion() {
  if (currentIndex >= quizQuestions.length) {
    showResult();
    return;
  }

  const q = quizQuestions[currentIndex];
  document.getElementById('qNum').textContent = '第 ' + q.id + ' 题';
  document.getElementById('qText').textContent = q.question;

  const badge = document.getElementById('typeBadge');
  badge.className = 'type-badge';
  if (q.type === 'single') { badge.classList.add('type-single'); badge.textContent = '单 选 题'; }
  else if (q.type === 'multi') { badge.classList.add('type-multi'); badge.textContent = '多 选 题'; }
  else { badge.classList.add('type-judge'); badge.textContent = '判 断 题'; }

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';

  if (q.type === 'judge') {
    [{v:'T',l:'✓ &nbsp; 对 (正确)'},{v:'F',l:'✗ &nbsp; 错 (错误)'}].forEach(({v,l}) => {
      const div = document.createElement('div');
      div.className = 'option';
      div.onclick = () => toggleOption(q, v);
      if (isSelected(q.id, v)) div.classList.add('selected');
      if (submitted[q.id]) {
        if (v === q.answer) div.classList.add('correct');
        else if (isSelected(q.id, v)) div.classList.add('wrong');
      }
      div.innerHTML = '<span class="opt-label">' + (v === 'T' ? '✓' : '✗') + '</span><span class="opt-text">' + l + '</span>';
      container.appendChild(div);
    });
  } else {
    Object.entries(q.options).forEach(([key, text]) => {
      const div = document.createElement('div');
      div.className = 'option';
      div.onclick = () => toggleOption(q, key);
      if (isSelected(q.id, key)) div.classList.add('selected');
      if (submitted[q.id]) {
        if (q.type === 'single' && key === q.answer) div.classList.add('correct');
        else if (q.type === 'multi' && q.answer.includes(key)) div.classList.add('correct');
        else if (isSelected(q.id, key)) div.classList.add('wrong');
      }
      div.innerHTML = '<span class="opt-label">' + key + '</span><span class="opt-text">' + text + '</span>';
      container.appendChild(div);
    });
  }

  document.getElementById('btnPrev').classList.toggle('hidden', currentIndex === 0);
  document.getElementById('btnSubmit').classList.toggle('hidden', submitted[q.id] === true);
  document.getElementById('btnNext').classList.toggle('hidden', !submitted[q.id]);
  document.getElementById('btnNext').textContent = currentIndex >= quizQuestions.length - 1 ? '查看结果 ▶' : '下一题 ▶';

  updateStats();
}

function toggleOption(q, key) {
  if (submitted[q.id]) return;
  const userAns = answers[q.id] || '';
  if (q.type === 'single' || q.type === 'judge') {
    answers[q.id] = key;
  } else {
    let arr = userAns ? userAns.split('') : [];
    if (arr.includes(key)) arr = arr.filter(k => k !== key);
    else { arr.push(key); arr.sort(); }
    answers[q.id] = arr.join('');
  }
  renderQuestion();
}

function isSelected(qId, key) {
  const ans = answers[qId] || '';
  const q = quizQuestions.find(q => q.id === qId);
  if (q && q.type === 'multi') return ans.split('').includes(key);
  return ans === key;
}

function submitAnswer() {
  const q = quizQuestions[currentIndex];
  if (!answers[q.id]) { alert('请先选择答案！'); return; }
  submitted[q.id] = true;
  if (answers[q.id] !== q.answer) {
    if (!wrongIds.includes(q.id)) wrongIds.push(q.id);
  } else {
    wrongIds = wrongIds.filter(id => id !== q.id);
  }
  localStorage.setItem('military_wrong_ids', JSON.stringify(wrongIds));
  updateStats();
  renderQuestion();
}

function nextQuestion() { currentIndex++; renderQuestion(); }
function prevQuestion() { if (currentIndex > 0) { currentIndex--; renderQuestion(); } }

// ========== STATS ==========
function updateStats() {
  const total = quizQuestions.length;
  const done = Object.keys(submitted).length;
  const correct = Object.entries(submitted).filter(([qId]) => {
    const q = quizQuestions.find(q => q.id === parseInt(qId));
    return q && answers[parseInt(qId)] === q.answer;
  }).length;
  document.getElementById('statCurrent').textContent = currentIndex + 1;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statCorrect').textContent = correct;
  document.getElementById('statWrong').textContent = done - correct;
  document.getElementById('statRemain').textContent = total - done;
  document.getElementById('progressFill').style.width = total > 0 ? (done / total * 100) + '%' : '0%';
}

// ========== RESULT ==========
function showResult() {
  document.getElementById('quizArea').classList.add('hidden');
  document.getElementById('resultArea').classList.remove('hidden');

  const total = quizQuestions.length;
  const correct = Object.entries(submitted).filter(([qId]) => {
    const q = quizQuestions.find(q => q.id === parseInt(qId));
    return q && answers[parseInt(qId)] === q.answer;
  }).length;
  const pct = total > 0 ? Math.round(correct / total * 100) : 0;
  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('resultCorrect').textContent = correct;
  document.getElementById('resultWrong').textContent = total - correct;
  document.getElementById('resultTotal').textContent = total;
  document.getElementById('resultBar').style.width = pct + '%';

  // Military rank comments
  let icon, grade;
  if (pct >= 95) { icon = '🏆'; grade = '将 军 级'; }
  else if (pct >= 85) { icon = '🎖️'; grade = '校 官 级'; }
  else if (pct >= 70) { icon = '⭐'; grade = '尉 官 级'; }
  else if (pct >= 60) { icon = '⚔️'; grade = '士 官 级'; }
  else { icon = '🛡️'; grade = '新 兵 级 · 继续努力'; }

  document.getElementById('rankIcon').textContent = icon;
  document.getElementById('gradeComment').innerHTML =
    '<span style="font-size:16px;color:#f0d878;letter-spacing:3px;font-weight:800;">' + grade + '</span>';
}

// ========== REVIEW ==========
function reviewWrong() {
  document.getElementById('resultArea').classList.add('hidden');
  document.getElementById('quizArea').classList.add('hidden');
  document.getElementById('reviewArea').classList.remove('hidden');

  const wrongQs = quizQuestions.filter(q => submitted[q.id] && answers[q.id] !== q.answer);
  document.getElementById('reviewCount').textContent = wrongQs.length;

  document.getElementById('reviewList').innerHTML = wrongQs.map(q => {
    const ua = answers[q.id] || '未作答';
    const ca = q.answer;
    const opts = q.type === 'judge' ? '' :
      '<div style="font-size:13px;margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;color:#8a9b6e;">' +
      Object.entries(q.options).map(([k,v]) => {
        let s = '';
        if (k === ca || ca.includes(k)) s = 'color:#5adb8a;font-weight:700;';
        return '<span style="' + s + '">' + k + '. ' + v + '</span>';
      }).join('&emsp;') + '</div>';

    return '<div class="review-item">' +
      '<span class="status status-fail">错误</span> ' +
      '<span style="font-size:12px;color:#6a7b4e;">Q' + q.id + ' | ' +
        (q.type === 'single' ? '单选' : q.type === 'multi' ? '多选' : '判断') + '</span>' +
      '<p style="margin-top:8px;line-height:1.6;color:#d4cca0;">' + q.question + '</p>' +
      opts +
      '<p style="margin-top:8px;">' +
        '<span style="color:#e88a8a;">你的答案：' + fmt(q, ua) + '</span> ' +
        '<span style="color:#5adb8a;margin-left:12px;">正确答案：' + fmt(q, ca) + '</span>' +
      '</p></div>';
  }).join('');
}

function fmt(q, ans) {
  if (q.type === 'judge') return ans === 'T' ? '对' : '错';
  return ans;
}

// ========== KEYBOARD ==========
document.addEventListener('keydown', (e) => {
  if (document.getElementById('quizArea').classList.contains('hidden')) return;
  const q = quizQuestions[currentIndex];
  if (!q) return;
  const key = e.key.toUpperCase();
  if (!submitted[q.id] && ['A','B','C','D','E','T','F'].includes(key)) {
    e.preventDefault();
    const opts = document.querySelectorAll('.option');
    let idx = q.type === 'judge' ? (key === 'T' ? 0 : key === 'F' ? 1 : -1) : key.charCodeAt(0) - 65;
    if (idx >= 0 && idx < opts.length) opts[idx].click();
  }
  if (e.key === 'Enter') {
    e.preventDefault();
    if (!submitted[q.id]) submitAnswer();
    else nextQuestion();
  }
  if (e.key === 'ArrowRight' && submitted[q.id]) { e.preventDefault(); nextQuestion(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); prevQuestion(); }
});
</script>
