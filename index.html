<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>军理题库 · 答题系统</title>
<style>
/* ====== RESET & BASE ====== */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #1a1e25;
  --surface: #22262f;
  --surface-raised: #282d38;
  --border: #353b48;
  --border-accent: #545b60;
  --text: #d0cec4;
  --text-dim: #878780;
  --text-muted: #5f6058;
  --brass: #b5a870;
  --brass-dim: #8a8058;
  --green: #6a9a5a;
  --green-bg: #1e2d1a;
  --red: #c06050;
  --red-bg: #2d1a1a;
  --blue: #5a8aaa;
  --blue-bg: #1a2830;
  --amber: #c89840;
  --amber-bg: #2d2210;
}

body {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', Georgia, 'Songti SC', 'Microsoft YaHei', serif;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ====== SUBTLE DOT GRID BACKGROUND ====== */
body::before {
  content: '';
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  z-index: 0; pointer-events: none; opacity: 0.22;
  background-image: radial-gradient(circle, #4a5040 0.6px, transparent 0.6px);
  background-size: 20px 20px;
}

.container { max-width: 780px; margin: 0 auto; padding: 24px 20px; position: relative; z-index: 1; }

/* ====== HEADER ====== */
.header {
  text-align: center; padding: 32px 24px 24px; margin-bottom: 24px;
  border-bottom: 1px solid var(--brass-dim);
  position: relative;
}
.header h1 {
  font-size: 24px; font-weight: 900; letter-spacing: 6px; color: var(--brass);
  margin-bottom: 6px; font-family: 'Noto Serif SC', Georgia, 'Songti SC', serif;
}
.header .subtitle {
  font-size: 12px; letter-spacing: 4px; color: var(--text-dim); text-transform: uppercase;
}
.header .rule {
  width: 48px; height: 1px; background: var(--brass-dim);
  margin: 14px auto 0;
}

/* ====== STATS ROW ====== */
.stats { display: flex; gap: 1px; justify-content: center; margin-bottom: 20px; background: var(--border); }
.stat-card {
  flex: 1; min-width: 0; padding: 12px 8px; text-align: center;
  background: var(--surface); cursor: default;
}
.stat-card .num {
  font-size: 20px; font-weight: 700; color: var(--brass);
  font-family: 'Georgia', 'Times New Roman', serif;
}
.stat-card .label { font-size: 10px; color: var(--text-muted); margin-top: 2px; letter-spacing: 1px; text-transform: uppercase; }
.stat-card.accent-green .num { color: var(--green); }
.stat-card.accent-red .num { color: var(--red); }

/* ====== PROGRESS ====== */
.progress-wrap { padding: 0 0 18px 0; margin-bottom: 8px; }
.progress-bar { height: 3px; background: var(--border); overflow: hidden; }
.progress-fill {
  height: 100%; background: var(--brass);
  transition: width 0.4s ease;
}

/* ====== EXAM TIMER ====== */
.timer-bar {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  padding: 10px 16px; margin-bottom: 16px;
  background: var(--surface); border: 1px solid var(--border);
}
.timer-text {
  font-size: 18px; font-weight: 700; font-family: 'SF Mono', 'Consolas', 'Menlo', monospace;
  letter-spacing: 2px; color: var(--brass);
}
.timer-text.danger { color: var(--red); animation: blink 0.8s step-end infinite; }
.timer-bar-inner { flex: 1; height: 3px; background: var(--border); overflow: hidden; max-width: 180px; }
.timer-bar-fill { height: 100%; background: var(--brass); transition: width 1s linear; }
.timer-bar-fill.danger { background: var(--red); }

@keyframes blink { 50% { opacity: 0.3; } }

/* ====== NAVIGATOR ====== */
.navigator-toggle { text-align: center; margin-bottom: 8px; }
.navigator-toggle button {
  background: none; border: none; color: var(--text-dim);
  font-size: 11px; cursor: pointer; letter-spacing: 1px; padding: 4px 12px;
  font-family: inherit;
}
.navigator-toggle button:hover { color: var(--brass); }
.navigator-grid {
  display: flex; flex-wrap: wrap; gap: 5px; justify-content: center;
  padding: 10px; margin-bottom: 14px;
  background: var(--surface); border: 1px solid var(--border);
  max-height: 170px; overflow-y: auto;
}
.nav-dot {
  width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600; cursor: pointer; flex-shrink: 0;
  background: var(--bg); color: var(--text-dim); border: 1px solid var(--border);
  transition: all 0.12s; font-family: 'Georgia', serif;
}
.nav-dot:hover { border-color: var(--brass-dim); }
.nav-dot.current { border-color: var(--brass); color: var(--brass); background: var(--surface-raised); }
.nav-dot.correct { border-color: var(--green); background: var(--green-bg); color: var(--green); }
.nav-dot.wrong { border-color: var(--red); background: var(--red-bg); color: var(--red); }
.nav-dot.bookmarked { box-shadow: inset 0 0 0 1px var(--brass-dim); }

/* ====== QUESTION CARD ====== */
.card {
  background: var(--surface);
  padding: 24px; margin-bottom: 18px;
  border: 1px solid var(--border);
  position: relative;
}
.card .type-badge {
  display: inline-block; padding: 2px 10px; font-size: 11px; font-weight: 600;
  letter-spacing: 1px; margin-bottom: 14px;
}
.type-single { background: var(--green-bg); color: var(--green); border: 1px solid #2d4a24; }
.type-multi { background: var(--amber-bg); color: var(--amber); border: 1px solid #4a3010; }
.type-judge { background: var(--blue-bg); color: var(--blue); border: 1px solid #203040; }
.card .q-num { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; letter-spacing: 1px; }
.card .q-text { font-size: 16px; line-height: 1.8; color: var(--text); margin-bottom: 22px; }

/* ====== BOOKMARK ====== */
.bookmark-btn {
  position: absolute; top: 10px; right: 14px; z-index: 5;
  font-size: 18px; cursor: pointer; color: var(--text-muted); background: none; border: none;
  transition: color 0.15s; padding: 6px; line-height: 1; font-family: serif;
}
.bookmark-btn:hover { color: var(--brass-dim); }
.bookmark-btn.bookmarked { color: var(--brass); }

/* ====== OPTIONS ====== */
.options { display: flex; flex-direction: column; gap: 8px; }
.option {
  display: flex; align-items: flex-start; padding: 12px 14px;
  border: 1px solid var(--border); cursor: pointer; transition: all 0.12s;
  background: var(--bg);
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
  touch-action: manipulation;
}
.option:hover { border-color: var(--border-accent); background: #20242c; }
.option.selected { border-color: var(--brass-dim); background: #282a20; }
.option.correct { border-color: var(--green); background: var(--green-bg); }
.option.wrong { border-color: var(--red); background: var(--red-bg); }
.option .opt-label {
  width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px; margin-right: 12px; flex-shrink: 0;
  background: #15181f; color: var(--text-dim); font-family: 'Georgia', serif;
  border: 1px solid var(--border); transition: all 0.12s;
}
.option.selected .opt-label { background: var(--brass-dim); color: #1a1e25; border-color: var(--brass-dim); }
.option.correct .opt-label { background: var(--green); color: #fff; border-color: var(--green); }
.option.wrong .opt-label { background: var(--red); color: #fff; border-color: var(--red); }
.option .opt-text { flex: 1; font-size: 14px; line-height: 1.5; padding-top: 2px; color: #c0bdb0; }
.option.correct .opt-text { color: #b0d8a0; }
.option.wrong .opt-text { color: #d8a0a0; }

/* ====== FLASHCARD ====== */
.flashcard-reveal {
  display: none; padding-top: 14px; margin-top: 14px;
  border-top: 1px dashed var(--border);
}
.flashcard-reveal.show { display: block; animation: fadeIn 0.3s ease; }
.flashcard-reveal .correct-answer {
  display: inline-block; padding: 3px 12px; background: var(--green-bg);
  color: var(--green); border: 1px solid #2d4a24; font-weight: 600; font-size: 13px; letter-spacing: 1px;
}
.flashcard-tap-hint {
  text-align: center; color: var(--text-muted); font-size: 12px;
  margin-top: 10px; letter-spacing: 1px;
}

/* ====== BUTTONS ====== */
.btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 18px; }
.btn {
  padding: 10px 20px; border: 1px solid var(--border); font-size: 13px; cursor: pointer;
  transition: all 0.12s; font-weight: 600; letter-spacing: 1px;
  background: var(--surface); color: var(--text-dim); font-family: inherit;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
  touch-action: manipulation;
}
.btn:hover { border-color: var(--border-accent); color: var(--text); }
.btn:active { background: var(--surface-raised); }
.btn-primary { background: #2d3520; color: var(--brass); border-color: #4a5030; }
.btn-primary:hover { background: #353e28; border-color: #6a6838; color: #d8c880; }
.btn-success { background: #1e2d1a; color: var(--green); border-color: #2d4a24; }
.btn-success:hover { background: #253822; border-color: #3d5a32; }
.btn-outline { background: transparent; color: var(--text-dim); border-color: var(--border); }
.btn-outline:hover { background: var(--surface); color: var(--text); }
.btn-danger { background: #2d1a1a; color: var(--red); border-color: #4a2020; }
.btn-danger:hover { background: #382222; }
.btn-exam {
  background: #2a2415; color: var(--brass); border-color: #4a3a18; font-size: 15px;
  padding: 14px 48px; letter-spacing: 3px;
}
.btn-exam:hover { background: #36301e; border-color: #6a5020; color: #d8c880; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }

/* ====== MODE SELECT ====== */
.mode-container { text-align: center; margin: 32px 0; }
.mode-title { font-size: 16px; color: var(--text-dim); margin-bottom: 6px; letter-spacing: 3px; }
.mode-count { font-size: 14px; color: var(--text-muted); margin-bottom: 30px; }
.mode-count b { color: var(--brass); font-size: 17px; }
.mode-section { margin-top: 30px; }
.mode-section-title {
  font-size: 13px; color: var(--text-muted); margin-bottom: 16px;
  letter-spacing: 2px; text-transform: uppercase;
}
.exam-hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

/* ====== HISTORY ====== */
.history-panel { margin-top: 24px; text-align: left; max-width: 500px; margin-left: auto; margin-right: auto; }
.history-panel-inner {
  background: var(--surface); border: 1px solid var(--border);
  padding: 14px; max-height: 260px; overflow-y: auto;
}
.history-row {
  display: flex; align-items: center; gap: 10px; padding: 7px 8px;
  border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text-dim);
}
.history-row:last-child { border-bottom: none; }
.history-row .h-date { flex: 1; color: var(--text-muted); font-size: 11px; }
.history-row .h-mode { color: var(--text-dim); font-size: 10px; min-width: 35px; text-align: center; letter-spacing: 1px; }
.history-row .h-score { font-weight: 700; font-size: 15px; min-width: 40px; text-align: center; }
.history-row .h-bar-wrap { flex: 2; height: 3px; background: var(--border); overflow: hidden; }
.history-row .h-bar { height: 100%; }
.history-trend { text-align: center; font-size: 13px; margin-top: 10px; letter-spacing: 1px; color: var(--text-dim); }

/* ====== RESULT ====== */
.result-card { text-align: center; }
.result-card .rank-badge {
  display: inline-block; padding: 8px 28px; margin-bottom: 12px;
  font-size: 14px; font-weight: 700; letter-spacing: 4px;
  border: 1px solid;
}
.result-card .score {
  font-size: 64px; font-weight: 900; color: var(--brass);
  font-family: 'Georgia', 'Times New Roman', serif;
}
.result-card .score-detail { color: var(--text-dim); margin: 10px 0 20px; font-size: 14px; }
.result-card .score-detail b { color: var(--text); }
.result-card .bar-wrap { height: 6px; background: var(--border); margin: 14px 0; overflow: hidden; }
.result-card .bar-fill { height: 100%; transition: width 0.6s ease; background: var(--brass); }

/* ====== REVIEW ====== */
.review-item {
  background: var(--surface); padding: 14px; margin-bottom: 10px;
  border: 1px solid var(--border);
}
.review-item .status { display: inline-block; padding: 2px 8px; font-size: 11px; font-weight: 600; letter-spacing: 1px; }
.status-fail { background: var(--red-bg); color: var(--red); border: 1px solid #4a2020; }

/* ====== KEYBOARD HINT ====== */
.kbd-hint { text-align: center; font-size: 11px; color: var(--text-muted); margin-bottom: 12px; letter-spacing: 0.5px; }
.kbd-hint b { color: var(--text-dim); }

/* ====== HIDDEN ====== */
.hidden { display: none !important; }

/* ====== ANIMATIONS ====== */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes cardIn { from { opacity: 0.6; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }
.screen-enter { animation: slideUp 0.28s ease-out; }
.card-enter { animation: cardIn 0.22s ease-out; }

/* ====== RESPONSIVE: 平板 ====== */
@media (max-width: 820px) {
  .container { padding: 16px 14px; }
  .header { padding: 24px 16px 18px; }
  .header h1 { font-size: 22px; letter-spacing: 4px; }
}

/* ====== RESPONSIVE: 手机 ====== */
@media (max-width: 600px) {
  .container { padding: 10px 8px; }
  .header { padding: 20px 12px 16px; border-bottom-width: 1px; }
  .header h1 { font-size: 18px; letter-spacing: 3px; }
  .header .subtitle { font-size: 10px; letter-spacing: 2px; }
  .header .rule { width: 36px; }

  .stats { gap: 1px; }
  .stat-card { padding: 10px 4px; }
  .stat-card .num { font-size: 16px; }
  .stat-card .label { font-size: 9px; }

  .card { padding: 14px 12px; }
  .card .q-text { font-size: 15px; line-height: 1.7; }
  .card .q-num { font-size: 11px; }

  .option { padding: 10px 8px; }
  .option .opt-label { width: 32px; height: 32px; min-width: 32px; font-size: 12px; margin-right: 8px; }
  .option .opt-text { font-size: 13px; }

  .btn-group { gap: 6px; }
  .btn { padding: 10px 14px; font-size: 12px; letter-spacing: 0.5px; min-height: 44px; }
  .btn-exam { width: 100%; font-size: 14px; padding: 13px 20px; letter-spacing: 2px; }
  .btn-primary[onclick*="startQuiz('all')"] { width: 100%; font-size: 14px; padding: 13px 20px; }

  .kbd-hint { display: none; }

  .mode-container { margin: 16px 0; }
  .mode-title { font-size: 14px; }
  .mode-count { font-size: 12px; margin-bottom: 20px; }
  .mode-section-title { font-size: 11px; }

  .result-card .score { font-size: 48px; }
  .result-card .rank-badge { font-size: 12px; padding: 6px 20px; letter-spacing: 2px; }
  .result-card .score-detail { font-size: 12px; }

  .review-item { padding: 10px; }
  .review-item p { font-size: 13px; }

  .navigator-grid { gap: 4px; padding: 8px; }
  .nav-dot { width: 24px; height: 24px; font-size: 9px; }
  .bookmark-btn { font-size: 16px; top: 6px; right: 8px; }

  .timer-text { font-size: 15px; }
}

/* ====== RESPONSIVE: 小屏 ====== */
@media (max-width: 380px) {
  .header h1 { font-size: 16px; letter-spacing: 2px; }
  .card .q-text { font-size: 14px; }
  .option { padding: 9px 6px; }
  .option .opt-label { width: 28px; height: 28px; min-width: 28px; font-size: 11px; margin-right: 6px; }
  .option .opt-text { font-size: 12px; }
  .btn { padding: 9px 10px; font-size: 11px; min-height: 40px; }
  .result-card .score { font-size: 40px; }
  .nav-dot { width: 22px; height: 22px; font-size: 8px; }
}
</style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <h1>军 理 题 库</h1>
    <p class="subtitle">Military Theory &mdash; Examination Preparation</p>
    <div class="rule"></div>
  </div>

  <!-- Mode Selection -->
  <div id="modeSelect">
    <div class="mode-container">
      <p class="mode-title">题 库 概 览</p>
      <p class="mode-count">共计 <b id="totalCount">0</b> 道题目</p>

      <div class="btn-group">
        <button class="btn btn-exam" onclick="startExam()">模 拟 考 试</button>
      </div>
      <p class="exam-hint">随机 100 题 · 限时 90 分钟</p>

      <div class="btn-group" style="margin-top:16px;">
        <button class="btn btn-primary" onclick="startQuiz('all')" style="font-size:15px;padding:13px 44px;">全 部 题 目 练 习</button>
      </div>

      <div class="mode-section">
        <p class="mode-section-title">按 类 型 练 习</p>
        <div class="btn-group">
          <button class="btn btn-outline" onclick="startQuiz('single')">单选题 <b id="singleCount">0</b></button>
          <button class="btn btn-outline" onclick="startQuiz('multi')">多选题 <b id="multiCount">0</b></button>
          <button class="btn btn-outline" onclick="startQuiz('judge')">判断题 <b id="judgeCount">0</b></button>
        </div>
        <div class="btn-group" style="margin-top:8px;">
          <button class="btn btn-outline" onclick="startBrowse()">快速浏览</button>
          <button class="btn btn-outline" onclick="startQuiz('bookmarked')">收藏题目</button>
        </div>
        <div class="btn-group" style="margin-top:8px;">
          <button class="btn btn-danger" onclick="startQuiz('wrong')">错 题 重 练</button>
          <button class="btn btn-outline" onclick="toggleHistory()">成绩记录</button>
        </div>
      </div>

      <!-- Score History -->
      <div id="historyPanel" class="history-panel hidden">
        <p style="text-align:center;color:var(--brass);letter-spacing:2px;margin-bottom:10px;font-size:14px;">成 绩 记 录</p>
        <div class="history-panel-inner" id="historyList"></div>
        <p id="historyTrend" class="history-trend"></p>
        <div class="btn-group" style="margin-top:10px;">
          <button class="btn btn-outline" onclick="clearHistory()" style="font-size:11px;">清空记录</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Quiz Area -->
  <div id="quizArea" class="hidden">
    <!-- Timer -->
    <div class="timer-bar hidden" id="timerBar">
      <span style="font-size:11px;color:var(--text-muted);letter-spacing:1px;">剩余时间</span>
      <span class="timer-text" id="timerText">90:00</span>
      <div class="timer-bar-inner"><div class="timer-bar-fill" id="timerFill" style="width:100%"></div></div>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat-card"><div class="num" id="statCurrent">1</div><div class="label">当前</div></div>
      <div class="stat-card"><div class="num" id="statTotal">0</div><div class="label">总题数</div></div>
      <div class="stat-card accent-green"><div class="num" id="statCorrect">0</div><div class="label">正确</div></div>
      <div class="stat-card accent-red"><div class="num" id="statWrong">0</div><div class="label">错误</div></div>
      <div class="stat-card"><div class="num" id="statRemain">0</div><div class="label">剩余</div></div>
    </div>

    <!-- Progress -->
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>

    <!-- Navigator -->
    <div class="navigator-toggle">
      <button onclick="toggleNavigator()">题号导航</button>
    </div>
    <div class="navigator-grid hidden" id="navigatorGrid"></div>

    <!-- Keyboard hint -->
    <div class="kbd-hint">快捷键：<b>A-E</b> 选择 &nbsp;|&nbsp; <b>T/F</b> 判断 &nbsp;|&nbsp; <b>Enter</b> 提交/下一题 &nbsp;|&nbsp; <b>&larr;&rarr;</b> 翻题</div>

    <!-- Question Card -->
    <div class="card" id="questionCard">
      <button class="bookmark-btn" id="bookmarkBtn" onclick="toggleBookmark()" title="收藏">&#9734;</button>
      <div class="type-badge" id="typeBadge"></div>
      <div class="q-num" id="qNum"></div>
      <div class="q-text" id="qText"></div>
      <div class="options" id="optionsContainer"></div>
      <div class="flashcard-reveal" id="flashcardReveal">
        <p style="font-size:13px;color:var(--green);font-weight:600;">正确答案：<span id="flashcardAnswer"></span></p>
      </div>
      <div class="flashcard-tap-hint hidden" id="flashcardHint">点击下方按钮查看答案</div>
    </div>

    <!-- Buttons -->
    <div class="btn-group">
      <button class="btn btn-outline" id="btnPrev" onclick="prevQuestion()">&larr; 上一题</button>
      <button class="btn btn-primary" id="btnSubmit" onclick="submitAnswer()">提交答案</button>
      <button class="btn btn-success hidden" id="btnNext" onclick="nextQuestion()">下一题 &rarr;</button>
      <button class="btn btn-outline hidden" id="btnReveal" onclick="revealAnswer()">显示答案</button>
      <button class="btn btn-outline" id="btnBack" onclick="backToMenu()">返回菜单</button>
    </div>
  </div>

  <!-- Result -->
  <div id="resultArea" class="hidden">
    <div class="card result-card">
      <p style="font-size:14px;color:var(--text-dim);margin-bottom:6px;letter-spacing:2px;" id="resultLabel">练 习 完 成</p>
      <div class="rank-badge" id="rankBadge">--</div>
      <div class="score" id="scorePercent" style="margin-top:16px;">0%</div>
      <div class="score-detail">
        正确 <b id="resultCorrect" style="color:var(--green)">0</b>
        &nbsp;/&nbsp;
        错误 <b id="resultWrong" style="color:var(--red)">0</b>
        &nbsp;/&nbsp;
        总计 <b id="resultTotal">0</b>
      </div>
      <div class="bar-wrap"><div class="bar-fill" id="resultBar" style="width:0%"></div></div>

      <div class="btn-group" style="margin-top:20px;">
        <button class="btn btn-primary" onclick="reviewWrong()">查看错题</button>
        <button class="btn btn-outline" onclick="restartQuiz()">重新练习</button>
        <button class="btn btn-outline" onclick="backToMenu()">返回菜单</button>
      </div>
    </div>
  </div>

  <!-- Review -->
  <div id="reviewArea" class="hidden">
    <div style="text-align:center;margin-bottom:18px;">
      <p style="font-size:16px;color:var(--brass);letter-spacing:3px;">错 题 回 顾</p>
      <p style="font-size:13px;color:var(--text-dim);margin-top:4px;">共 <span id="reviewCount" style="color:var(--red);font-weight:700;">0</span> 题需要复习</p>
    </div>
    <div id="reviewList"></div>
    <div class="btn-group" style="margin-top:18px;">
      <button class="btn btn-primary" onclick="startQuiz('wrong')">重做错题</button>
      <button class="btn btn-outline" onclick="restartQuiz()">全部重来</button>
      <button class="btn btn-outline" onclick="backToMenu()">返回菜单</button>
    </div>
  </div>
</div>

<script src="tiku_data.js"></script>
<script>
let quizQuestions = [];
let currentIndex = 0;
let answers = {};
let submitted = {};
let wrongIds = JSON.parse(localStorage.getItem('military_wrong_ids') || '[]');
let bookmarkedIds = JSON.parse(localStorage.getItem('military_bookmarked_ids') || '[]');
let scoreHistory = JSON.parse(localStorage.getItem('military_score_history') || '[]');
let examMode = false, examEndTime = null, examTimerInterval = null;
let browseMode = false, navigatorOpen = false;

document.getElementById('totalCount').textContent = QUESTION_BANK.length;
document.getElementById('singleCount').textContent = QUESTION_BANK.filter(q => q.type === 'single').length;
document.getElementById('multiCount').textContent = QUESTION_BANK.filter(q => q.type === 'multi').length;
document.getElementById('judgeCount').textContent = QUESTION_BANK.filter(q => q.type === 'judge').length;

function shuffle(arr) { const a = [...arr]; for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function formatTime(s) { return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function animateScreenIn(el) { el.classList.remove('screen-enter'); void el.offsetWidth; el.classList.add('screen-enter'); }
function animateCardIn() { const c=document.getElementById('questionCard'); c.classList.remove('card-enter'); void c.offsetWidth; c.classList.add('card-enter'); }
function showScreen(id) { ['modeSelect','quizArea','resultArea','reviewArea'].forEach(s=>document.getElementById(s).classList.add('hidden')); const el=document.getElementById(id); el.classList.remove('hidden'); animateScreenIn(el); }

function startQuiz(mode) {
  stopTimer(); examMode=false; browseMode=false;
  let pool;
  if (mode==='all') pool=[...QUESTION_BANK];
  else if (mode==='single'||mode==='multi'||mode==='judge') pool=QUESTION_BANK.filter(q=>q.type===mode);
  else if (mode==='wrong') { if(!wrongIds.length){alert('没有错题记录。');return;} pool=QUESTION_BANK.filter(q=>wrongIds.includes(q.id)); }
  else if (mode==='bookmarked') { if(!bookmarkedIds.length){alert('没有收藏题目。点击题目右上角 ☆ 收藏。');return;} pool=QUESTION_BANK.filter(q=>bookmarkedIds.includes(q.id)); }
  quizQuestions=shuffle(pool); currentIndex=0; answers={}; submitted={};
  showScreen('quizArea');
  document.getElementById('timerBar').classList.add('hidden');
  document.getElementById('btnReveal').classList.add('hidden');
  document.getElementById('btnSubmit').classList.remove('hidden');
  document.getElementById('btnNext').classList.add('hidden');
  document.getElementById('flashcardHint').classList.add('hidden');
  document.getElementById('flashcardReveal').classList.remove('show');
  updateStats(); renderQuestion();
}

function startExam() {
  stopTimer(); examMode=true; browseMode=false;
  quizQuestions=shuffle([...QUESTION_BANK]).slice(0,100);
  currentIndex=0; answers={}; submitted={};
  showScreen('quizArea');
  document.getElementById('timerBar').classList.remove('hidden');
  document.getElementById('btnReveal').classList.add('hidden');
  document.getElementById('btnSubmit').classList.remove('hidden');
  document.getElementById('btnNext').classList.add('hidden');
  document.getElementById('flashcardHint').classList.add('hidden');
  document.getElementById('flashcardReveal').classList.remove('show');
  examEndTime=Date.now()+90*60*1000; updateTimer();
  examTimerInterval=setInterval(updateTimer,1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&examMode&&examEndTime)updateTimer();});
  updateStats(); renderQuestion();
}

function startBrowse() {
  stopTimer(); examMode=false; browseMode=true;
  quizQuestions=shuffle([...QUESTION_BANK]); currentIndex=0; answers={}; submitted={};
  showScreen('quizArea');
  document.getElementById('timerBar').classList.add('hidden');
  document.getElementById('btnReveal').classList.remove('hidden');
  document.getElementById('btnSubmit').classList.add('hidden');
  document.getElementById('btnNext').classList.remove('hidden');
  document.getElementById('btnPrev').classList.remove('hidden');
  document.getElementById('flashcardHint').classList.remove('hidden');
  document.getElementById('flashcardReveal').classList.remove('show');
  updateStats(); renderQuestion();
}

function stopTimer() { if(examTimerInterval){clearInterval(examTimerInterval);examTimerInterval=null;} examEndTime=null; }

function updateTimer() {
  if(!examEndTime)return;
  const r=Math.max(0,Math.round((examEndTime-Date.now())/1000));
  document.getElementById('timerText').textContent=formatTime(r);
  document.getElementById('timerFill').style.width=(r/5400*100)+'%';
  const d=r<=300;
  document.getElementById('timerText').classList.toggle('danger',d);
  document.getElementById('timerFill').classList.toggle('danger',d);
  if(r<=0){stopTimer(); quizQuestions.forEach(q=>{if(!submitted[q.id]){submitted[q.id]=true;if(!wrongIds.includes(q.id))wrongIds.push(q.id);}}); localStorage.setItem('military_wrong_ids',JSON.stringify(wrongIds)); showResult();}
}

function toggleNavigator() { navigatorOpen=!navigatorOpen; document.getElementById('navigatorGrid').classList.toggle('hidden',!navigatorOpen); if(navigatorOpen)renderNavigator(); }

function renderNavigator() {
  if(!navigatorOpen)return;
  document.getElementById('navigatorGrid').innerHTML=quizQuestions.map((q,i)=>{
    let c='nav-dot'; if(i===currentIndex)c+=' current'; if(submitted[q.id])c+=(answers[q.id]===q.answer)?' correct':' wrong'; if(bookmarkedIds.includes(q.id))c+=' bookmarked';
    return '<div class="'+c+'" onclick="jumpToQuestion('+i+')">'+(i+1)+'</div>';
  }).join('');
}

function jumpToQuestion(i) { currentIndex=i; document.getElementById('flashcardReveal').classList.remove('show'); renderQuestion(); renderNavigator(); }

function toggleBookmark() {
  const q=quizQuestions[currentIndex]; if(!q)return;
  if(bookmarkedIds.includes(q.id)) bookmarkedIds=bookmarkedIds.filter(id=>id!==q.id);
  else bookmarkedIds.push(q.id);
  localStorage.setItem('military_bookmarked_ids',JSON.stringify(bookmarkedIds));
  updateBookmarkIcon(); if(navigatorOpen)renderNavigator();
}

function updateBookmarkIcon() {
  const q=quizQuestions[currentIndex], b=document.getElementById('bookmarkBtn');
  if(q&&bookmarkedIds.includes(q.id)){b.innerHTML='&#9733;';b.classList.add('bookmarked');}
  else{b.innerHTML='&#9734;';b.classList.remove('bookmarked');}
}

function backToMenu() { stopTimer(); examMode=false; browseMode=false; navigatorOpen=false; showScreen('modeSelect'); }

function restartQuiz() {
  stopTimer();
  if(examMode){startExam();return;}
  quizQuestions=shuffle(quizQuestions.length>0?[...quizQuestions]:[...QUESTION_BANK]);
  currentIndex=0; answers={}; submitted={};
  document.getElementById('flashcardReveal').classList.remove('show');
  showScreen('quizArea'); updateStats(); renderQuestion();
}

function renderQuestion() {
  if(currentIndex>=quizQuestions.length){showResult();return;}
  const q=quizQuestions[currentIndex];
  document.getElementById('qNum').textContent='第 '+q.id+' 题';
  document.getElementById('qText').textContent=q.question;
  const badge=document.getElementById('typeBadge'); badge.className='type-badge';
  if(q.type==='single'){badge.classList.add('type-single');badge.textContent='单选题';}
  else if(q.type==='multi'){badge.classList.add('type-multi');badge.textContent='多选题';}
  else{badge.classList.add('type-judge');badge.textContent='判断题';}
  updateBookmarkIcon();
  const container=document.getElementById('optionsContainer'); container.innerHTML='';
  if(q.type==='judge'){
    [{v:'T',l:'对 (正确)'},{v:'F',l:'错 (错误)'}].forEach(({v,l})=>{
      const d=document.createElement('div'); d.className='option';
      d.onclick=()=>toggleOption(q,v);
      if(isSelected(q.id,v))d.classList.add('selected');
      if(submitted[q.id]){if(v===q.answer)d.classList.add('correct');else if(isSelected(q.id,v))d.classList.add('wrong');}
      d.innerHTML='<span class="opt-label">'+(v==='T'?'T':'F')+'</span><span class="opt-text">'+l+'</span>';
      container.appendChild(d);
    });
  }else{
    Object.entries(q.options).forEach(([key,text])=>{
      const d=document.createElement('div'); d.className='option';
      d.onclick=()=>toggleOption(q,key);
      if(isSelected(q.id,key))d.classList.add('selected');
      if(submitted[q.id]){if(q.type==='single'&&key===q.answer)d.classList.add('correct');else if(q.type==='multi'&&q.answer.includes(key))d.classList.add('correct');else if(isSelected(q.id,key))d.classList.add('wrong');}
      d.innerHTML='<span class="opt-label">'+key+'</span><span class="opt-text">'+text+'</span>';
      container.appendChild(d);
    });
  }
  document.getElementById('btnPrev').classList.toggle('hidden',browseMode?false:currentIndex===0);
  document.getElementById('btnSubmit').classList.toggle('hidden',submitted[q.id]===true||browseMode);
  document.getElementById('btnNext').classList.toggle('hidden',browseMode?false:!submitted[q.id]);
  document.getElementById('btnReveal').classList.toggle('hidden',!browseMode);
  document.getElementById('flashcardHint').classList.toggle('hidden',!browseMode);
  document.getElementById('flashcardReveal').classList.remove('show');
  document.getElementById('btnNext').textContent=currentIndex>=quizQuestions.length-1?'查看结果 →':'下一题 →';
  updateStats(); if(navigatorOpen)renderNavigator(); animateCardIn();
}

function toggleOption(q,key) { if(submitted[q.id]||browseMode)return; const u=answers[q.id]||''; if(q.type==='single'||q.type==='judge')answers[q.id]=key; else{let a=u?u.split(''):[];if(a.includes(key))a=a.filter(k=>k!==key);else{a.push(key);a.sort();}answers[q.id]=a.join('');} renderQuestion(); }
function isSelected(qId,key){const a=answers[qId]||'';const q=quizQuestions.find(q=>q.id===qId);if(q&&q.type==='multi')return a.split('').includes(key);return a===key;}

function submitAnswer() {
  const q=quizQuestions[currentIndex]; if(!answers[q.id]){alert('请先选择答案。');return;}
  submitted[q.id]=true;
  if(answers[q.id]!==q.answer){if(!wrongIds.includes(q.id))wrongIds.push(q.id);}
  else{wrongIds=wrongIds.filter(id=>id!==q.id);}
  localStorage.setItem('military_wrong_ids',JSON.stringify(wrongIds));
  updateStats(); renderQuestion();
}

function revealAnswer() {
  const q=quizQuestions[currentIndex]; if(!q)return;
  document.getElementById('flashcardAnswer').textContent=fmt(q,q.answer);
  document.getElementById('flashcardReveal').classList.add('show');
  document.getElementById('flashcardHint').classList.add('hidden');
}

function nextQuestion(){currentIndex++;document.getElementById('flashcardReveal').classList.remove('show');renderQuestion();}
function prevQuestion(){if(currentIndex>0){currentIndex--;document.getElementById('flashcardReveal').classList.remove('show');renderQuestion();}}

function updateStats() {
  const t=quizQuestions.length, done=Object.keys(submitted).length;
  const correct=Object.entries(submitted).filter(([qId])=>{const q=quizQuestions.find(q=>q.id===parseInt(qId));return q&&answers[parseInt(qId)]===q.answer;}).length;
  document.getElementById('statCurrent').textContent=currentIndex+1;
  document.getElementById('statTotal').textContent=t;
  document.getElementById('statCorrect').textContent=correct;
  document.getElementById('statWrong').textContent=done-correct;
  document.getElementById('statRemain').textContent=t-done;
  document.getElementById('progressFill').style.width=t>0?(done/t*100)+'%':'0%';
}

function showResult() {
  stopTimer(); showScreen('resultArea');
  const t=quizQuestions.length;
  const correct=Object.entries(submitted).filter(([qId])=>{const q=quizQuestions.find(q=>q.id===parseInt(qId));return q&&answers[parseInt(qId)]===q.answer;}).length;
  const pct=t>0?Math.round(correct/t*100):0;
  document.getElementById('scorePercent').textContent=pct+'%';
  document.getElementById('resultCorrect').textContent=correct;
  document.getElementById('resultWrong').textContent=t-correct;
  document.getElementById('resultTotal').textContent=t;
  document.getElementById('resultBar').style.width=pct+'%';
  document.getElementById('resultLabel').textContent=examMode?'模 拟 考 试 结 束':'练 习 完 成';

  let grade, color, border;
  if(pct>=95){grade='将 军';color='#d8c880';border='#8a7a30';}
  else if(pct>=85){grade='校 官';color='#c0b870';border='#6a6830';}
  else if(pct>=70){grade='尉 官';color='#b5a860';border='#5a6028';}
  else if(pct>=60){grade='士 官';color='#a09850';border='#4a5020';}
  else{grade='新 兵';color='#888048';border='#3a4018';}
  const badge=document.getElementById('rankBadge');
  badge.textContent=grade;
  badge.style.color=color; badge.style.borderColor=border;

  saveScore(examMode?'模拟考试':'练习',t,correct,pct);
}

function saveScore(mode,total,correct,pct){
  const now=new Date();
  scoreHistory.push({date:now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),mode,total,correct,pct});
  if(scoreHistory.length>50)scoreHistory=scoreHistory.slice(-50);
  localStorage.setItem('military_score_history',JSON.stringify(scoreHistory));
}

function toggleHistory() {
  const p=document.getElementById('historyPanel');
  if(p.classList.contains('hidden')){p.classList.remove('hidden');renderHistory();}
  else p.classList.add('hidden');
}

function renderHistory() {
  if(!scoreHistory.length){document.getElementById('historyList').innerHTML='<p style="text-align:center;color:var(--text-muted);padding:16px;">暂无记录</p>';document.getElementById('historyTrend').textContent='';return;}
  const recent=[...scoreHistory].reverse();
  document.getElementById('historyList').innerHTML=recent.map(h=>{
    let c='var(--text-dim)'; if(h.pct>=85)c='var(--green)'; else if(h.pct>=70)c='var(--brass)'; else if(h.pct<60)c='var(--red)';
    return '<div class="history-row"><span class="h-date">'+h.date+'</span><span class="h-mode">'+h.mode+'</span><span class="h-score" style="color:'+c+'">'+h.pct+'%</span><div class="h-bar-wrap"><div class="h-bar" style="width:'+h.pct+'%;background:'+c+';"></div></div><span style="font-size:10px;min-width:50px;text-align:right;">'+h.correct+'/'+h.total+'</span></div>';
  }).join('');
  let trend='';
  if(recent.length>=2){const a=recent.slice(0,3).map(h=>h.pct).reduce((a,b)=>a+b,0)/Math.min(3,recent.length);const p=scoreHistory.slice(-4,-1);const pa=p.length>0?p.reduce((a,b)=>a+b.pct,0)/p.length:a;if(a>pa+3)trend='↑ 进步中';else if(a<pa-3)trend='↓ 需努力';else trend='→ 保持稳定';}
  document.getElementById('historyTrend').textContent=trend;
}

function clearHistory() { if(confirm('确定清空所有成绩记录？')){scoreHistory=[];localStorage.setItem('military_score_history','[]');renderHistory();} }

function reviewWrong() {
  showScreen('reviewArea');
  const wrongQs=quizQuestions.filter(q=>submitted[q.id]&&answers[q.id]!==q.answer);
  document.getElementById('reviewCount').textContent=wrongQs.length;
  document.getElementById('reviewList').innerHTML=wrongQs.map(q=>{
    const ua=answers[q.id]||'未作答', ca=q.answer;
    const opts=q.type==='judge'?'':'<div style="font-size:12px;margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;color:var(--text-dim);">'+Object.entries(q.options).map(([k,v])=>{let s='';if(k===ca||ca.includes(k))s='color:var(--green);font-weight:600;';return '<span style="'+s+'">'+k+'. '+v+'</span>';}).join('&emsp;')+'</div>';
    return '<div class="review-item"><span class="status status-fail">错误</span> <span style="font-size:11px;color:var(--text-muted);">Q'+q.id+' | '+(q.type==='single'?'单选':q.type==='multi'?'多选':'判断')+'</span><p style="margin-top:8px;line-height:1.6;color:var(--text);">'+q.question+'</p>'+opts+'<p style="margin-top:8px;"><span style="color:var(--red);">你的答案：'+fmt(q,ua)+'</span> <span style="color:var(--green);margin-left:12px;">正确答案：'+fmt(q,ca)+'</span></p></div>';
  }).join('');
}

function fmt(q,ans){if(q.type==='judge')return ans==='T'?'对':'错';return ans;}

document.addEventListener('keydown',(e)=>{
  if(document.getElementById('quizArea').classList.contains('hidden'))return;
  const q=quizQuestions[currentIndex]; if(!q)return;
  if(browseMode){
    if(e.key==='ArrowRight'){e.preventDefault();nextQuestion();}
    if(e.key==='ArrowLeft'){e.preventDefault();prevQuestion();}
    if(e.key==='Enter'||e.key===' '){e.preventDefault();revealAnswer();}
    return;
  }
  const key=e.key.toUpperCase();
  if(!submitted[q.id]&&['A','B','C','D','E','T','F'].includes(key)){
    e.preventDefault();
    const opts=document.querySelectorAll('.option');
    let idx=q.type==='judge'?(key==='T'?0:key==='F'?1:-1):key.charCodeAt(0)-65;
    if(idx>=0&&idx<opts.length)opts[idx].click();
  }
  if(e.key==='Enter'){e.preventDefault();if(!submitted[q.id])submitAnswer();else nextQuestion();}
  if(e.key==='ArrowRight'&&(submitted[q.id]||browseMode)){e.preventDefault();nextQuestion();}
  if(e.key==='ArrowLeft'){e.preventDefault();prevQuestion();}
});
</script>
</body>
</html>
